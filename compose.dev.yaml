name: solar-home-ha-dev

services:
  homeassistant:
    image: acrsolarhome.azurecr.io/home-assistant:ha-2026.10.4-sungrow-6.7.0-ac5d0816d73d18ee8641e0e8b2e43b24385287b8-run-41339763651-1
    environment:
      TZ: Europe/Brussels
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_FIND_LINKS: ""
      PIP_CONFIG_FILE: /dev/null
      UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple
      UV_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
      UV_INDEX: ""
      UV_EXTRA_INDEX_URL: ""
      UV_FIND_LINKS: ""
      UV_NO_CONFIG: "true"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - homeassistant-config:/config
    restart: "unless-stopped"
    stop_grace_period: 60s

volumes:
  homeassistant-config:
