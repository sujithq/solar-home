name: Build and push Home Assistant Sungrow image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.config.outputs.tag }}
      home_assistant_version: ${{ steps.config.outputs.home_assistant_version }}
      sungrow_dependency_version: ${{ steps.config.outputs.sungrow_dependency_version }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

    steps:
      - name: Check out build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate publication configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME ACR_LOGIN_SERVER; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required Actions secret ${variable} is missing."
              exit 1
            fi
          done

          if [[ "$ACR_NAME" != "acrsolarhome" || "$ACR_LOGIN_SERVER" != "acrsolarhome.azurecr.io" ]]; then
            echo "::error::Registry secrets do not match the approved publication destination."
            exit 1
          fi

          versions="build/homeassistant/versions.json"
          if ! jq -e '
            [.home_assistant, .sungrow_integration, .sungrow_dependency]
            | all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
          ' "$versions" > /dev/null; then
            echo "::error::Version configuration is missing or contains an invalid version."
            exit 1
          fi

          home_assistant_version="$(jq -r '.home_assistant' "$versions")"
          sungrow_integration_version="$(jq -r '.sungrow_integration' "$versions")"
          sungrow_dependency_version="$(jq -r '.sungrow_dependency' "$versions")"

          # Keep the secret registry hostname out of job outputs.
          tag="ha-${home_assistant_version}-sungrow-${sungrow_integration_version}-dep-${sungrow_dependency_version}-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ${#tag} -gt 128 ]]; then
            echo "::error::Versioned image tag exceeds the Docker tag length limit."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "home_assistant_version=${home_assistant_version}" >> "$GITHUB_OUTPUT"
          echo "sungrow_dependency_version=${sungrow_dependency_version}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      id-token: write

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/home-assistant:${{ needs.validate.outputs.tag }}
      HOME_ASSISTANT_VERSION: ${{ needs.validate.outputs.home_assistant_version }}
      SUNGROW_DEPENDENCY_VERSION: ${{ needs.validate.outputs.sungrow_dependency_version }}

    steps:
      - name: Check out build files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/solar-home-docker

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to ACR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/solar-home-docker
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME" --output none

      - name: Build and push ${{ matrix.platform }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/solar-home-docker
        shell: bash
        run: |
          set -euo pipefail

          docker buildx build \
            --pull \
            --progress=plain \
            --platform "${{ matrix.platform }}" \
            --build-arg "HOME_ASSISTANT_VERSION=${HOME_ASSISTANT_VERSION}" \
            --build-arg "SUNGROW_DEPENDENCY_VERSION=${SUNGROW_DEPENDENCY_VERSION}" \
            --tag "${IMAGE}-${{ matrix.architecture }}" \
            --push \
            ./build/homeassistant

      - name: Clear Docker registry authentication
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/solar-home-docker
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DOCKER_CONFIG:-}" && -f "$DOCKER_CONFIG/config.json" ]]; then
            rm -- "$DOCKER_CONFIG/config.json"
          fi

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/home-assistant:${{ needs.validate.outputs.tag }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/solar-home-docker

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to ACR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/solar-home-docker
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME" --output none

      - name: Create and verify multi-platform image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/solar-home-docker
        shell: bash
        run: |
          set -euo pipefail

          repository="${ACR_LOGIN_SERVER}/home-assistant"

          amd64_inspection="$(docker buildx imagetools inspect "${IMAGE}-amd64")"
          amd64_digest="$(printf '%s\n' "$amd64_inspection" | awk '$1 == "Digest:" {print $2; exit}')"
          arm64_inspection="$(docker buildx imagetools inspect "${IMAGE}-arm64")"
          arm64_digest="$(printf '%s\n' "$arm64_inspection" | awk '$1 == "Digest:" {print $2; exit}')"

          for digest in "$amd64_digest" "$arm64_digest"; do
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::A platform image digest could not be verified."
              exit 1
            fi
          done

          docker buildx imagetools create \
            --tag "$IMAGE" \
            "${repository}@${amd64_digest}" \
            "${repository}@${arm64_digest}"

          docker buildx imagetools inspect "$IMAGE"

          docker buildx imagetools inspect --raw "$IMAGE" |
            jq -e '
              [.manifests[]? |
                select(.platform.os == "linux") |
                .platform.architecture]
              | (index("amd64") != null and index("arm64") != null)
            ' > /dev/null

          inspection="$(docker buildx imagetools inspect "$IMAGE")"
          digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" {print $2; exit}')"

          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Published image digest could not be verified."
            exit 1
          fi

          printf '### Published Home Assistant image\n\nTag: `%s`\n\nDigest: `%s@%s`\n\nPlatforms: linux/amd64, linux/arm64\n\nBuild completed; no Home Assistant startup or device test.\n' \
            "$IMAGE" "$repository" "$digest" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Clear Docker registry authentication
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/solar-home-docker
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DOCKER_CONFIG:-}" && -f "$DOCKER_CONFIG/config.json" ]]; then
            rm -- "$DOCKER_CONFIG/config.json"
          fi
