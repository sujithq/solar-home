name: Build and push Home Assistant Sungrow image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/sujithq-home-assistant-dev-compose'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      DOCKER_CONFIG: ${{ runner.temp }}/solar-home-docker
    steps:
      - name: Validate publication configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME ACR_LOGIN_SERVER; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required Actions variable ${variable} is missing."
              exit 1
            fi
          done
          if [[ "$ACR_NAME" != "acrsolarhome" || "$ACR_LOGIN_SERVER" != "acrsolarhome.azurecr.io" ]]; then
            echo "::error::Registry variables do not match the approved publication destination."
            exit 1
          fi
          image="${ACR_LOGIN_SERVER}/home-assistant:ha-2026.10.4-sungrow-6.7.0-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
      - name: Check out build files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify exact Sungrow dependency
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --progress=plain --tag "$IMAGE" ./build/homeassistant
      - name: Sign in to Azure with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push verified image to ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME" --output none
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' > "$RUNNER_TEMP/image-digests.txt"
          digest=$(grep -F "${ACR_LOGIN_SERVER}/home-assistant@sha256:" "$RUNNER_TEMP/image-digests.txt")
          if [[ ! "$digest" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Published image digest could not be verified."
            exit 1
          fi
          printf '### Published Home Assistant image\n\nTag: `%s`\n\nDigest: `%s`\n\nLinux amd64; dependency imports verified, no HA startup or device test.\n' \
            "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Clear Docker registry authentication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$DOCKER_CONFIG/config.json" ]]; then
            rm -- "$DOCKER_CONFIG/config.json"
          fi
