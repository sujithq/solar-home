name: Verify Home Assistant Sungrow image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out build files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify exact Sungrow dependency
        run: >-
          docker build --pull --progress=plain
          --tag solar-home-ha:2026.10.4-sungrow-6.7.0
          ./build/homeassistant
